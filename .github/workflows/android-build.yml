name: Android Build APK

on:
  # 1. main 브랜치에 push가 발생할 때 실행
  push:
    branches: [ "master" ]
  # 2. pull request가 발생할 때 실행
  pull_request:
    branches: [ "master" ]
  # 3. Actions 탭에서 수동으로 클릭해서 실행 가능 (테스트용으로 유용)
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code (코드 가져오기)
      uses: actions/checkout@v4

    - name: Set up JDK 17 (자바 설정 - 프로젝트 버전에 맞춰 수정 가능)
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew (Gradle 권한 부여)
      run: chmod +x gradlew

    - name: Build with Gradle (Debug APK 빌드)
      run: ./gradlew assembleDebug

    - name: Upload APK (빌드된 APK 업로드)
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/app-debug.apk
        # path 경로는 프로젝트 구조에 따라 다를 수 있음 (보통 app/build/outputs/apk/debug/)
